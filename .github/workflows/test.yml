name: 测试验收（每次修改都跑，不发布生产数据）

# 本 workflow 只做测试，绝不向 main 提交任何文件（不自动提交 legado.json、签名、APK）
# 手动触发除外——手动触发用于验证 Android APK 构建

on:
  push:
    branches:
      - main
      - 'audit/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  # 只做测试，不发布——收紧为只读
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node 语法检查
        run: |
          echo "### node --check 语法检查" >> $GITHUB_STEP_SUMMARY
          for f in *.js; do
            echo "  检查 $f" >> $GITHUB_STEP_SUMMARY
            node --check "$f" || exit 1
          done
          echo "  检查 scripts/source-audit.mjs (ESM)" >> $GITHUB_STEP_SUMMARY
          node --check "scripts/source-audit.mjs" || exit 1
          echo "  检查 tests/official-contract.test.js" >> $GITHUB_STEP_SUMMARY
          node --check "tests/official-contract.test.js" || exit 1

      - name: 回归测试（含 URL 主键 + 权重 clamp + Java 语法扫描）
        run: node tests/repo-regression.test.js

      # JS 求值器单元测试：书源 searchUrl 的 <js>/@js: 脚本由 src/legado-js.js 离线求值。
      # 这组测试同时锁死沙箱安全边界（拿不到 require/process、逃逸被拒、死循环被超时切断），
      # 因为我们在 CI 里执行的是「别人写的脚本」，边界一旦失守就是任意代码执行。
      - name: JS 求值器单元测试（含沙箱安全审计）
        run: node tests/legado-js.test.mjs

      # CI 权限边界回归：锁死「执行外部书源 JS」与「持有写权限 + 签名私钥」
      # 不落在同一个 workflow 里。任何把 JS 求值挪回写权限 job、
      # 或给 checkout 重新打开凭据持久化的改动，都会在这里红灯。
      - name: CI 权限边界回归（JS 求值隔离 / 凭据持久化）
        run: node tests/ci-boundary.test.mjs

      # 数据契约端到端：health 报告 → export-health-json → 生产端导入 → score.js 评分。
      # 锁死「导出字段集必须覆盖 score.js 依赖」—— 曾经只导 4 个字段，
      # 导致 146 个可用源的基础分从 70 塌到 25。单模块测试全绿也发现不了这类断裂。
      - name: 数据契约端到端（导出 → 导入 → 评分）
        run: node tests/data-contract.test.mjs

      # 契约测试：拉 LegadoTeam/legado 的 ReaderProviderRoutes.kt / BookSource.kt 对一遍。
      # 官方删路由或删字段 → FAIL（我们还在用，会静默失败）；官方新增 → WARN（写进 reports/）。
      # 拉不到官方源码（网络抖动）→ SKIP 且 exit 0，不因外部网络挡住发布。
      - name: 官方契约检查（Provider 路由 + BookSource 字段）
        run: |
          echo "### 官方契约检查" >> $GITHUB_STEP_SUMMARY
          node tests/official-contract.test.js 2>&1 | tee /tmp/contract.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/contract.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 离线冒烟（mock HTTP，不代表真实上游验收）
        run: node smoke-p0.js

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7（直接下载二进制，绕开 GitHub Cache）
        run: |
          cd SourceAutoSync
          curl -L -o gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$(pwd)/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Android APK 构建（debug，硬门槛——SyncWorker.java 编译必须通过）
        run: |
          cd SourceAutoSync
          gradle assembleDebug --no-build-cache --rerun-tasks 2>&1 | tee build.log
        # 不再 continue-on-error：Java 编译失败必须阻断验收
