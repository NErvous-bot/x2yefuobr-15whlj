name: 更新书源
on:
  schedule:
    # UTC 02:23 ≈ 北京时间 10:23，错峰整点减少调度延迟；*/3 按日号取模，
    # 月底可能 31号→1号 连跑（已知无害，不处理）
    - cron: '23 2 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
# 并发锁：所有 main 写入工作流（update.yml / source-audit.yml / build-sync.yml）统一排队，
# 避免两个工作流同时读取旧版本、生成不同结果并争抢推送
#
# ══ 安全边界说明（2026-10-30 加固）══════════════════════════════════════════
# 本 workflow 有 contents:write，且后续步骤会用 ED25519_KEY 签名 —— 属于高权限。
# 书源允许 searchUrl 写成 <js>/@js: 脚本，执行它们等于运行不可信代码，
# 而 node:vm 不是安全沙箱。因此这类求值**不在这里做**：
#   上游 health 判定（会触发 JS 求值）已拆到 js-eval.yml：
#     permissions: contents:read / 零 Secrets / persist-credentials:false / 独立工作区
#   本 job 改为消费它产出的纯 JSON（js-eval-result.json），自己不执行任何书源代码。
# 同时本 job 的 checkout 关闭了凭据持久化，减少 token 在工作区里的暴露面。
# ═══════════════════════════════════════════════════════════════════════════
concurrency:
  group: repo-main-writer
  cancel-in-progress: false

jobs:
  # 低权限求值 job：无写权限、无 Secrets、独立工作区，只产出纯 JSON
  eval:
    permissions:
      contents: read
    uses: ./.github/workflows/js-eval.yml

  update:
    runs-on: ubuntu-latest
    needs: eval
    steps:
      - uses: actions/checkout@v4
        with:
          # 关键：默认 checkout 会把认证凭据写进 .git/config。
          # 虽然本 job 不执行外部书源 JS，仍按最小暴露面关闭；
          # 推送阶段需要凭据，故在此步骤之后单独恢复（见 Publish 步骤）。
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: P0 Smoke（上游拉取+健康+签名三关，exit 非 0 阻断发布）
        run: node smoke-p0.js
      # 上游自动扒取：ETag 增量 + 源级活跃度过滤 + 三关准入，产物 harvested.json
      # 由 filter.js 在「本地注入源」阶段并入成品；成人源默认全关（公开仓库不能有）
      - name: 上游自动扒取（ETag 增量 + 三关准入 + 成人分流）
        env:
          ALLOW_ADULT: ${{ secrets.ADULT_ENABLED }}
          ADULT_SRC_URL: ${{ secrets.ADULT_SRC_URL }}
        run: node upstream-sync.js
      - run: node filter.js
      # 规则自维护：抓真实正文巡检漏网广告，误伤0段+净化率提升才追加规则；
      # 脚本内部对任何异常 exit 0 跳过写入，失败不影响主流程
      - name: 规则自维护（漏网广告巡检+追加净化规则）
        run: node rules.js
      - name: 镜像线路探活
        run: node probe.js
      # ── 源健康检查已移到 js-eval.yml（低权限隔离 job）──────────────────────
      # health.js 会经 aging-test.js 触发 <js> 书源脚本求值。执行不可信代码
      # 不能发生在持有 contents:write + ED25519_KEY 的工作区里。
      # 这里改为消费那个 job 的纯 JSON 产物：只读数据，不执行代码。
      - name: 下载求值结果（纯 JSON，不执行代码）
        uses: actions/download-artifact@v4
        with:
          name: js-eval-result
          path: .

      - name: 导入求值结果 → health/source_health.json（结构再校验 + 完整性保护）
        run: |
          set -euo pipefail
          node -e "
            const fs=require('fs');

            // ══ 完整性保护（跨权限边界的必需校验）══════════════════════════════
            // 这份 JSON 来自 js-eval job —— 那个 job 执行了不可信书源脚本。
            // 即使它拿到的是低权限环境，产物本身仍是「可能被污染的数据」。
            // 因此生产侧不能只检查字段类型，还要校验它和当前成品的关系：
            //   · 结果的 URL 必须存在于当前 legado.json（不接受凭空新增的源）
            //   · 结果数量必须与本轮应测数量一致（拒绝漏测/多测）
            //   · URL 不得重复（拒绝用重复行覆盖同一条判定）
            //   · generatedAt 不得是未来时间、不得过期（拒绝陈旧快照）
            //   · 单轮 broken 比例异常时独立告警（防大规模误判一次性落地）
            // ═══════════════════════════════════════════════════════════════════
            const j=JSON.parse(fs.readFileSync('js-eval-result.json','utf8'));

            const expectedTop='generatedAt,results,totalSources,version';
            const keys=Object.keys(j).sort().join(',');
            if(keys!==expectedTop) throw new Error('unexpected top keys: '+keys);
            if(j.version!==2) throw new Error('unexpected version: '+j.version);
            if(!Array.isArray(j.results)||j.results.length===0) throw new Error('empty results');
            if(typeof j.totalSources!=='number'||j.totalSources!==j.results.length){
              throw new Error('totalSources mismatch: '+j.totalSources+' vs '+j.results.length);
            }

            // 时间合理性：不允许未来时间，也不允许超过 7 天的陈旧快照
            const now=Date.now();
            if(typeof j.generatedAt!=='number'||!Number.isFinite(j.generatedAt)) throw new Error('bad generatedAt');
            if(j.generatedAt>now+60000) throw new Error('generatedAt is in the future');
            if(now-j.generatedAt>7*86400000) throw new Error('generatedAt is stale (>7d)');

            // 与当前成品对账：结果集要落在成品的**身份键**空间里。
            //
            // ⚠️ 两处坑都必须避开（真实事故：run 41184777297 / 41193341145）
            //
            // ① 必须用 norm()，不能用裸 bookSourceUrl。
            //    health.js 写 sources 的 key 是 norm(bookSourceUrl)
            //    （src/source-id.js：去 #fragment、去 pathname 尾斜杠）。
            //    本仓库成品里 694 个源有 370 个 URL 带 # 或尾斜杠，
            //    裸串比对会把 372 行全判成 'result url not in product'。
            //    norm 与 canonicalizeUrl 的职责分工见 src/source-id.js 文件头。
            //
            // ② 结果集与成品**不是同一时刻的快照**，不能要求「每一行都必须在成品里」。
            //    eval job 在 filter.js **之前** checkout 并测源（694 个）；
            //    update job 随后跑 filter.js（上游合并、死域名剔除、老化复测、
            //    隔离池过滤…），成品会变。实测本仓库一轮里 filter 会删掉
            //    死域名 / 老化失效 / 隔离池里的源（例：https://newsmiss.lofter.com）。
            //    若要求「全部命中」，这些被删的源必然整轮阻断发布 ——
            //    而它们恰恰是**该被删**的，不是错误。
            //
            //    因此语义改为：结果里**至少要有一行命中成品**（证明产物没被调包），
            //    命中不了的行按「本轮已不在成品」丢弃；命中率过低则判定产物与成品
            //    脱节（快照太旧 / 认错仓库 / 产物污染），仍然 fail-closed。
            const { norm } = require('./src/source-id');
            const legado=JSON.parse(fs.readFileSync('legado.json','utf8'));
            const known=new Set();
            for(const s of legado){
              if(!s||!s.bookSourceUrl) continue;
              const k=norm(String(s.bookSourceUrl));
              if(k) known.add(k);
            }
            if(known.size===0) throw new Error('legado.json has no bookSourceUrl');
            if(j.results.length>known.size*2){
              throw new Error('results far exceed product sources: '+j.results.length+' vs '+known.size);
            }

            const allowed=new Set(['available','broken','untestable']);
            const counted={available:0,broken:0,untestable:0};
            const sources={}; const seen=new Set();
            let dropped=0;
            for(const r of j.results){
              if(typeof r.url!=='string'||r.url.length===0) throw new Error('bad url');
              if(seen.has(r.url)) throw new Error('duplicate url in results: '+r.url);
              seen.add(r.url);
              // 本轮已被 filter/quarantine 移出成品的行：跳过（不是错误）
              if(!known.has(r.url)){ dropped++; continue; }
              if(typeof r.state!=='string'||!allowed.has(r.state)) throw new Error('bad state: '+r.state);
              counted[r.state]++;
              // 逐字段校验并按原类型重建
              const bool=(x,n)=>{ if(x!==null&&typeof x!=='boolean') throw new Error('bad '+n+' for '+r.url); return x; };
              const num=(x,n)=>{ if(x!==null&&!(typeof x==='number'&&Number.isFinite(x))) throw new Error('bad '+n+' for '+r.url); return x; };
              const str=(x,n)=>{ if(typeof x!=='string') throw new Error('bad '+n+' for '+r.url); return x; };
              if(!Array.isArray(r.recent)) throw new Error('bad recent for '+r.url);
              if(r.recent.length>5) throw new Error('recent too long for '+r.url);
              for(const e of r.recent) if(typeof e!=='string') throw new Error('bad recent entry for '+r.url);

              sources[r.url]={
                name: str(r.name,'name'),
                health: num(r.health,'health'),
                search: bool(r.search,'search'),
                toc: bool(r.toc,'toc'),
                content: bool(r.content,'content'),
                chapters: num(r.chapters,'chapters'),
                contentLen: num(r.contentLen,'contentLen'),
                responseTime: num(r.responseTime,'responseTime'),
                note: str(r.note,'note'),
                checkedAt: num(r.checkedAt,'checkedAt'),
                recent: r.recent.slice(),
                flapping: bool(r.flapping,'flapping'),
                explore: bool(r.explore,'explore'),
                exploreNote: str(r.exploreNote,'exploreNote'),
                // 2026-10-31 新增的分档依据。缺了这三行，score.js 的
                // ipBlocked(160/130) 与 deepLimited（降一档）就全部失效 ——
                // run 72/73 就是这么白跑了两轮。新字段必须三处同步：
                //   aging-test 产出 → export-health-json 导出 → 这里重建
                ipBlocked: typeof r.ipBlocked === 'boolean' ? r.ipBlocked : false,
                deepLimited: typeof r.deepLimited === 'boolean' ? r.deepLimited : false,
                deepNote: str(r.deepNote === undefined ? '' : r.deepNote,'deepNote'),
              };
            }

            // 大规模状态突变保护：broken 占比异常时明确失败，不静默落库
            // 分母用「真正落库的行数」（= 命中成品的行），不是产物总行数
            const total=Object.keys(sources).length;
            if(total===0){
              throw new Error('no result row matched the current product —— 产物与成品完全脱节（快照过旧 / 认错仓库 / 产物被调包），拒绝落库');
            }
            if(dropped>0){
              console.log('dropped rows (本轮已被 filter/quarantine 移出成品): '+dropped);
            }
            const brokenRatio=counted.broken/total;
            console.log('state counts: available='+counted.available+' broken='+counted.broken+' untestable='+counted.untestable+' total='+total);
            console.log('broken ratio: '+(brokenRatio*100).toFixed(1)+'%');
            if(brokenRatio>0.6){
              throw new Error('broken ratio abnormally high: '+(brokenRatio*100).toFixed(1)+'% —— 疑似误判或产物污染，拒绝落库');
            }

            fs.mkdirSync('health',{recursive:true});
            fs.writeFileSync('health/source_health.json', JSON.stringify({
              updatedAt: j.generatedAt,
              summary: { total, usable: counted.available, broken: counted.broken, untestable: counted.untestable },
              sources,
            }));
            console.log('imported rows='+total+'（14 字段完整还原，含 search/toc/recent/flapping）');
          "
      - name: 源评分分层（健康分→核心/稳定/备用/观察/不可测/确认坏→weight 自动排序）
        run: node score.js
      # D3 硬断言必须在 fuse 之前：此时校验的是同轮候选成品；fuse BLOCKED 会有意把成品
      # 回滚到基线（新 scores 仅作诊断件），回滚后再比对会把保护动作误判成失败
      - name: 成品硬断言（URL规范无重复 + legado/scores weight 100%一致，失败即阻断裁决）
        run: node verify-product.js
      - name: 发布保险丝（旧可用→新坏复查裁决+数量熔断，BLOCKED时回滚成品只留诊断）
        run: node fuse.js
      # P0-1：dead 层（weight<=5）不再下发手机。必须在 fuse 之后跑——
      # fuse BLOCKED 时会把 legado.json 回滚到 HEAD 基线，这里再按最终成品做隔离，
      # 顺序反了会隔离掉一份马上被丢弃的候选文件（等于白跑）。
      # 必须在 ECDSA签名 之前跑，否则手机会拿到「内容已变、签名未变」的文件而全部验签失败。
      - name: 隔离池（稳定死亡源移出成品，写 quarantine.json，filter 下轮据此拦复活）
        run: node quarantine.js
      - name: 成品校验（防上游返回畸形数据被自动提交）
        run: |
          node -e "const a=require('./legado.json');if(!Array.isArray(a)||a.length<100)throw new Error('书源数异常:'+a.length)"
          node -e "const a=require('./legado.json');const bad=a.filter(s=>!s.ruleContent).length;if(bad/a.length>0.5)throw new Error('ruleContent缺失率过高:'+bad+'/'+a.length)"
          node -e "const r=require('./replaceRule.json');if(!Array.isArray(r)||r.length<1)throw new Error('净化规则异常:'+r.length)"
          echo "校验通过：legado.json 与 replaceRule.json 结构正常"
      - name: ECDSA签名（node内置crypto + 自验签，防镜像投毒）
        env:
          # Secret 名沿用 ED25519_KEY，现值为 EC P-256 PKCS#8 PEM 的 base64
          #（Ed25519 在部分 vivo/Android 机型上 KeyFactory 无法导入 X.509 公钥）
          ED25519_KEY: ${{ secrets.ED25519_KEY }}
        # 注意文件名：App 端按「原名+.sig」取签名，即 legado.json.sig / replaceRule.json.sig
        # 2026-10-04 起 runner 的 openssl 签名报 unsupported 导致 0 字节签名被静默提交，改用 node 内置 crypto 并强制自验签
        run: node sign.js
      - name: commit
        env:
          # checkout 关闭了 persist-credentials，推送阶段单独用令牌写 remote。
          # 这一步是本 job 里唯一需要写权限凭据的地方，且此时已无书源代码执行。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只在推送前一刻注入凭据（用 insteadOf 而非把 token 写进 .git/config 明文）
          git config --local url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          # 清理旧命名的签名文件（v3.5首版的 legado.sig/replaceRule.sig）
          git rm -q --ignore-unmatch legado.sig replaceRule.sig
          git add legado.json legado.json.sig replaceRule.json replaceRule.json.sig version.txt health/source_health.json urls.txt candidates.txt quarantine.json harvested.json upstream-state.json
          git add reports/ 2>/dev/null || true
          # push origin HEAD：在 main 上等价于推 main，在其他分支（测试）推同名分支
          git diff --cached --quiet || (
            git commit -m "auto update"
            if ! git pull --rebase origin main; then
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                # 两个写 main 的工作流偶发重叠时，rebase 必定在 health/reports/签名等生成物上冲突。
                # 注意 rebase 语义与 merge 相反：--ours 是远端（被 rebase 到的分支），--theirs 才是本轮提交。
                # 这些文件都是本轮刚重新生成的，逐个取 --theirs 并标记已解决；取错方向会让本轮成果整轮作废。
                for f in $(git diff --name-only --diff-filter=U); do
                  git checkout --theirs -- "$f" || continue
                  git add -- "$f"
                done
                # 仍有未解决冲突则让 rebase --continue 失败，宁可本轮不推送也不推半成品
                git diff --name-only --diff-filter=U
                GIT_EDITOR=true git rebase --continue
              else
                echo "拉取失败且没有进行中的 rebase，本轮不提交"
                exit 1
              fi
            fi
            git push origin HEAD
          )
