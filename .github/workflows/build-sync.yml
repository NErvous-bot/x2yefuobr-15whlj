name: 编译同步App
on:
  workflow_dispatch:
  # 源码一改就自动重编发布，避免 APK 长期落后于源码（此前只有手动触发，
  # 10-08 起的本地健康层等改动一直没进 APK）。本工作流只提交 sync-app.apk，
  # 不会命中 SourceAutoSync/** 路径，因此不会自我循环触发
  push:
    paths:
      - 'SourceAutoSync/**'
permissions:
  contents: write
concurrency:
  group: repo-main-writer
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 发布步骤要 rebase/push，必须全量历史
          # 与其它写权限 workflow 一致：不把 GITHUB_TOKEN 留在 .git/config，
          # 推送前在发布步骤里单独注入。减少 token 在工作区的暴露面。
          persist-credentials: false
      - name: 还原签名密钥
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > SourceAutoSync/keystore.jks
          echo "keystore大小: $(stat -c%s SourceAutoSync/keystore.jks) 字节"
      - name: 源文件诊断
        run: |
          echo "### runner上的源文件指纹" >> $GITHUB_STEP_SUMMARY
          md5sum SourceAutoSync/app/src/main/java/io/nervous/sourcesync/SyncWorker.java >> $GITHUB_STEP_SUMMARY
          grep -n -A14 "轻量指纹" SourceAutoSync/app/src/main/java/io/nervous/sourcesync/SyncWorker.java >> $GITHUB_STEP_SUMMARY || true
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: 编译（release 固定签名，以后可覆盖安装）
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          cd SourceAutoSync
          set -o pipefail
          gradle assembleRelease --no-build-cache --rerun-tasks 2>&1 | tee build.log
      - name: 错误摘要
        if: failure()
        run: |
          echo "### 编译错误（前20条）" >> $GITHUB_STEP_SUMMARY
          grep -m 20 -A4 "error:" SourceAutoSync/build.log >> $GITHUB_STEP_SUMMARY || echo "未见error行" >> $GITHUB_STEP_SUMMARY
      - name: 保存APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sync-app
          path: SourceAutoSync/app/build/outputs/apk/release/app-release.apk
      - name: 发布APK到仓库（国内绕过Azure下载页，直接走镜像线路）
        if: success() && github.ref == 'refs/heads/main'
        env:
          # checkout 关闭了 persist-credentials，推送前单独注入凭据。
          # 本 job 只编译 Android APK 并提交产物，不执行任何书源脚本。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          cp SourceAutoSync/app/build/outputs/apk/release/app-release.apk sync-app.apk
          git add sync-app.apk
          git diff --cached --quiet && echo "APK未变化，跳过发布" && exit 0
          git commit -m "发布 sync-app.apk"
          # 普通 push：远端已变化会失败，不会强制覆盖——与 update.yml/source-audit.yml 统一走 repo-main-writer 并发锁
          git push origin HEAD:main
