name: 三重验源 (Playwright)

# D2（Round3 补测 2026-10-20）：本工作流为纯审计入口——只跑 Playwright 三重验收并写
# reports/source-audit.json，严禁修改 legado.json / replaceRule.json / version.txt / 签名等任何成品。
# 产品成品的唯一发布入口是 update.yml（filter→health→score→fuse→校验→签名），
# 保证每份成品都与同一轮 health/scores/recheck 证据齐套落库。
on:
  # 每周日 04:00 UTC ≈ 北京时间 12:00 错峰跑一次
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-main-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 装 Playwright + Chromium
        run: |
          npm install playwright@latest
          npx playwright install chromium
      - name: 三重验收（纯审计：只写 reports/source-audit.json，禁止改任何成品）
        run: node scripts/source-audit.mjs
      - name: 基线同步（提交审计报告前 rebase）
        run: |
          git pull --rebase --autostash origin main

      - name: commit（仅允许审计报告入库）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 白名单暂存：只放审计报告；任何成品文件变更一律不得进入本工作流的提交
          git add reports/source-audit.json
          # 硬断言：工作树中的成品必须与 HEAD 逐字节一致（脚本越权写成品即红灯）
          for f in legado.json replaceRule.json version.txt legado.json.sig replaceRule.json.sig; do
            if ! git diff --quiet HEAD -- "$f"; then
              echo "::error::纯审计工作流不得修改成品文件: $f"
              git diff --stat HEAD -- "$f"
              exit 1
            fi
          done
          if git diff --cached --quiet; then
            echo "没有需要提交的审计报告变更"
            exit 0
          fi
          git commit -m "auto audit: $(date +%F)（纯审计，无成品变更）"
          git push origin HEAD
