name: 三重验源 (Playwright)

# D2（Round3 补测 2026-10-20）：本工作流为纯审计入口——只跑 Playwright 三重验收并写
# reports/source-audit.json，严禁修改 legado.json / replaceRule.json / version.txt / 签名等任何成品。
# 产品成品的唯一发布入口是 update.yml（filter→health→score→fuse→校验→签名），
# 保证每份成品都与同一轮 health/scores/recheck 证据齐套落库。
on:
  # 每周日 04:00 UTC ≈ 北京时间 12:00 错峰跑一次
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-main-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 装 Playwright + Chromium
        run: |
          npm install playwright@latest
          npx playwright install chromium
      - name: 三重验收（纯审计：只写 reports/source-audit.json，禁止改任何成品）
        run: node scripts/source-audit.mjs
      - name: 基线同步（提交审计报告前 rebase）
        run: |
          git pull --rebase --autostash origin main

      - name: commit（仅允许审计报告入库）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 白名单暂存：只放审计报告；任何成品文件变更一律不得进入本工作流的提交
          git add reports/source-audit.json
          # 硬断言：工作树中的成品必须与 HEAD 逐字节一致（脚本越权写成品即红灯）
          for f in legado.json replaceRule.json version.txt legado.json.sig replaceRule.json.sig; do
            if ! git diff --quiet HEAD -- "$f"; then
              echo "::error::纯审计工作流不得修改成品文件: $f"
              git diff --stat HEAD -- "$f"
              exit 1
            fi
          done
          if git diff --cached --quiet; then
            echo "没有需要提交的审计报告变更"
            exit 0
          fi
          git commit -m "auto audit: $(date +%F)（纯审计，无成品变更）"
          git push origin HEAD

  # 追更诊断：与三重验收分开跑，独立输出 reports/freshness-*.json/csv；
  # 只刷新题库（books.json）与诊断报告，同样严禁触碰任何成品/评分文件。
  # needs: audit —— 两个 job 都会写 main，串行化避免 rebase/push 竞争。
  freshness:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 取书失败不阻断：沿用仓库里现有的题库继续诊断（快照日期见 books.json 的 sampledAt）
      - name: 刷新追更题库（番茄实时热榜）
        continue-on-error: true
        run: node scripts/pick-books.js --count=20 --polls=4
      - name: 跨源追更诊断（只读 legado.json，只写 reports/freshness-*）
        env:
          # 每本书的时间预算；20 本 × 240s ≈ 80min，预算越大单本覆盖源越多
          AUDIT_BUDGET_SEC: '240'
        run: node freshness-audit.js
      - name: 基线同步（提交诊断报告前 rebase）
        run: |
          git pull --rebase --autostash origin main
      - name: commit（仅题库与追更报告入库）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books.json reports/freshness-summary.json reports/freshness-details.csv
          # 硬断言：诊断不得改动成品/评分/健康证据
          for f in legado.json replaceRule.json version.txt legado.json.sig replaceRule.json.sig health/source_health.json reports/source_scores.json; do
            if ! git diff --quiet HEAD -- "$f"; then
              echo "::error::追更诊断不得修改成品/评分文件: $f"
              git diff --stat HEAD -- "$f"
              exit 1
            fi
          done
          if git diff --cached --quiet; then
            echo "没有需要提交的追更报告变更"
            exit 0
          fi
          git commit -m "auto freshness: $(date +%F)（纯诊断，无成品变更）"
          git push origin HEAD
