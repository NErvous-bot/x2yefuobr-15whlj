name: 三重验源 (Playwright)

# D2（Round3 补测 2026-10-20）：本工作流为纯审计入口——只跑 Playwright 三重验收并写
# reports/source-audit.json，严禁修改 legado.json / replaceRule.json / version.txt / 签名等任何成品。
# 产品成品的唯一发布入口是 update.yml（filter→health→score→fuse→校验→签名），
# 保证每份成品都与同一轮 health/scores/recheck 证据齐套落库。
on:
  # 每周日 04:00 UTC ≈ 北京时间 12:00 错峰跑一次
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # ⚠️ 2026-11-01 修正：此前本 workflow 与 update.yml / build-sync.yml 共用
  # `repo-main-writer` 锁。本意是避免两个写 main 的工作流 rebase/push 竞争，
  # 但实测后果是：**纯审计**的 freshness（跨源追更诊断，逐源抓书页，
  # timeout 设到 180 分钟）长时间占锁，把生产发布 update.yml 卡在 pending，
  # 一卡就是 40 分钟以上 —— 审计成了发布的阻塞点，与本文件开头
  # 「审计与生产解耦」的设计目标完全相反。
  #
  # 是否必须共用同一把锁？不必：
  #   · audit     只写 reports/source-audit.json
  #   · freshness 只写 books.json + reports/freshness-*
  #   · update/build-sync 写成品（legado/sig/version/replaceRule…）
  # 写入文件集合不相交，push 冲突只发生在同一文件上。
  # 所以审计侧改用独立组，与生产并行；剩下唯一可能撞的「同一报告」
  # 也只有本 workflow 会写，本 workflow 自身已被这个组串行化。
  group: source-audit-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 与 update.yml 一致：默认 checkout 会把 GITHUB_TOKEN 留在 .git/config。
          # 本 job 只写审计报告，不执行书源 JS，但仍按最小暴露面关闭；
          # 推送阶段再单独恢复凭据（见 commit 步骤）。
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 装 Playwright + Chromium
        run: |
          npm install playwright@latest
          npx playwright install chromium
      - name: 三重验收（纯审计：只写 reports/source-audit.json，禁止改任何成品）
        run: node scripts/source-audit.mjs
      - name: 基线同步（提交审计报告前 rebase）
        run: |
          git pull --rebase --autostash origin main

      - name: commit（仅允许审计报告入库）
        env:
          # checkout 关闭了 persist-credentials；推送前单独注入，避免 token
          # 在整个 job 生命周期里都留在工作区的 git 配置中。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          # 白名单暂存：只放审计报告；任何成品文件变更一律不得进入本工作流的提交
          git add reports/source-audit.json
          # 硬断言：工作树中的成品必须与 HEAD 逐字节一致（脚本越权写成品即红灯）
          for f in legado.json replaceRule.json version.txt legado.json.sig replaceRule.json.sig; do
            if ! git diff --quiet HEAD -- "$f"; then
              echo "::error::纯审计工作流不得修改成品文件: $f"
              git diff --stat HEAD -- "$f"
              exit 1
            fi
          done
          if git diff --cached --quiet; then
            echo "没有需要提交的审计报告变更"
            exit 0
          fi
          git commit -m "auto audit: $(date +%F)（纯审计，无成品变更）"
          git push origin HEAD

  # 追更诊断：与三重验收分开跑，独立输出 reports/freshness-*.json/csv；
  # 只刷新题库（books.json）与诊断报告，同样严禁触碰任何成品/评分文件。
  # needs: audit —— 两个 job 都会写 main，串行化避免 rebase/push 竞争。
  freshness:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # 同 audit job：不把 token 留在工作区
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 取书失败不阻断：沿用仓库里现有的题库继续诊断（快照日期见 books.json 的 sampledAt）
      - name: 刷新追更题库（番茄实时热榜）
        continue-on-error: true
        run: node scripts/pick-books.js --count=20 --polls=4
      - name: 跨源追更诊断（只读 legado.json，只写 reports/freshness-*）
        env:
          # 每本书的时间预算；20 本 × 240s ≈ 80min，预算越大单本覆盖源越多
          AUDIT_BUDGET_SEC: '240'
        run: node freshness-audit.js
      - name: 基线同步（提交诊断报告前 rebase）
        run: |
          git pull --rebase --autostash origin main
      - name: commit（仅题库与追更报告入库）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git add books.json reports/freshness-summary.json reports/freshness-details.csv
          # 硬断言：诊断不得改动成品/评分/健康证据
          for f in legado.json replaceRule.json version.txt legado.json.sig replaceRule.json.sig health/source_health.json reports/source_scores.json; do
            if ! git diff --quiet HEAD -- "$f"; then
              echo "::error::追更诊断不得修改成品/评分文件: $f"
              git diff --stat HEAD -- "$f"
              exit 1
            fi
          done
          if git diff --cached --quiet; then
            echo "没有需要提交的追更报告变更"
            exit 0
          fi
          git commit -m "auto freshness: $(date +%F)（纯诊断，无成品变更）"
          git push origin HEAD
