name: 三重验源 (Playwright)

on:
  # 每周日 04:00 UTC ≈ 北京时间 12:00 错峰跑一次
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-main-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 装 Playwright + Chromium
        run: |
          npm install playwright@latest
          npx playwright install chromium
      - name: 三重验收
        run: node scripts/source-audit.mjs
      - name: 基线同步（在签名前 rebase，避免签名后文件变化导致签名失效）
        run: |
          git pull --rebase --autostash origin main

      - name: 接现有 pipeline（filter → health → score → fuse → sign）
        run: |
          node filter.js
          node health.js
          node score.js
          node fuse.js
          node sign.js
        env:
          ED25519_KEY: ${{ secrets.ED25519_KEY }}
      - name: 成品校验
        run: |
          node -e "const a=require('./legado.json');if(!Array.isArray(a)||a.length<100)throw new Error('书源数异常:'+a.length)"
          node -e "const a=require('./legado.json');const bad=a.filter(s=>!s.ruleContent).length;if(bad/a.length>0.5)throw new Error('ruleContent缺失率过高:'+bad+'/'+a.length)"
      - name: commit（脚本不再自行 commit，发布权统一在 workflow）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只暂存明确允许发布的输出文件——不盲目 git add .
          git add legado.json legado.json.sig replaceRule.json replaceRule.json.sig version.txt
          git add reports/source-audit.json reports/rank-report.md reports/fuse-summary.txt 2>/dev/null || true
          # 基线已在签名前同步，这里不再 rebase（签名后文件不能再变）
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
            exit 0
          fi
          git commit -m "auto audit: $(date +%F)"
          git push origin HEAD
