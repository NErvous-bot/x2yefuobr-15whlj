name: 编译同步App
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 发布步骤要 rebase/push，必须全量历史
      - name: 还原签名密钥
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > SourceAutoSync/keystore.jks
          echo "keystore大小: $(stat -c%s SourceAutoSync/keystore.jks) 字节"
      - name: 源文件诊断
        run: |
          echo "### runner上的源文件指纹" >> $GITHUB_STEP_SUMMARY
          md5sum SourceAutoSync/app/src/main/java/io/nervous/sourcesync/SyncWorker.java >> $GITHUB_STEP_SUMMARY
          grep -n -A14 "轻量指纹" SourceAutoSync/app/src/main/java/io/nervous/sourcesync/SyncWorker.java >> $GITHUB_STEP_SUMMARY || true
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: 编译（release 固定签名，以后可覆盖安装）
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          cd SourceAutoSync
          set -o pipefail
          gradle assembleRelease --no-build-cache --rerun-tasks 2>&1 | tee build.log
      - name: 错误摘要
        if: failure()
        run: |
          echo "### 编译错误（前20条）" >> $GITHUB_STEP_SUMMARY
          grep -m 20 -A4 "error:" SourceAutoSync/build.log >> $GITHUB_STEP_SUMMARY || echo "未见error行" >> $GITHUB_STEP_SUMMARY
      - name: 保存APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sync-app
          path: SourceAutoSync/app/build/outputs/apk/release/app-release.apk
      - name: 发布APK到仓库（国内绕过Azure下载页，直接走镜像线路）
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp SourceAutoSync/app/build/outputs/apk/release/app-release.apk sync-app.apk
          git add sync-app.apk
          git diff --cached --quiet && echo "APK未变化，跳过发布" && exit 0
          git commit -m "发布 sync-app.apk"
          # 直接 force-with-lease 推送：fetch-depth=0 已保证本地有最新历史，
          # 不需要 rebase（rebase 会和远端的并发提交冲突）。
          # force-with-lease 避免误覆盖远端新提交。
          git push --force-with-lease origin HEAD:main
