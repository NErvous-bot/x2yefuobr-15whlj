name: 测试验收（每次修改都跑，不发布生产数据）

# 本 workflow 只做测试，绝不向 main 提交任何文件（不自动提交 legado.json、签名、APK）
# 手动触发除外——手动触发用于验证 Android APK 构建

on:
  push:
    branches:
      - main
      - 'audit/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node 语法检查
        run: |
          echo "### node --check 语法检查" >> $GITHUB_STEP_SUMMARY
          for f in rank-legado.js health.js smoke-p0.js filter.js fuse.js sign.js score.js probe.js; do
            echo "  检查 $f" >> $GITHUB_STEP_SUMMARY
            node --check "$f" || exit 1
          done
          echo "  检查 scripts/source-audit.mjs (ESM)" >> $GITHUB_STEP_SUMMARY
          node --check "scripts/source-audit.mjs" || exit 1

      - name: 回归测试（14 项，含 URL 主键 + 权重 clamp + 安全检查）
        run: node tests/repo-regression.test.js

      - name: 离线冒烟（mock HTTP，不代表真实上游验收）
        run: node smoke-p0.js

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Android APK 构建（debug，验证 SyncWorker.java 能编译）
        run: |
          cd SourceAutoSync
          set -o pipefail
          # 用 debug 构建，不需要签名密钥——只验证 Java 源码能编译通过
          gradle assembleDebug --no-build-cache --rerun-tasks 2>&1 | tee build.log
        continue-on-error: true
        if: always()
