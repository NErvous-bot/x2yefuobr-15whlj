plugins {
    id 'com.android.application'
}

android {
    namespace 'io.nervous.sourcesync'
    compileSdk 34

    defaultConfig {
        applicationId 'io.nervous.sourcesync'
        // minSdk 33 维持不变（验签已改用 ECDSA P-256，全版本可用；
        // 不降 minSdk 以免扩大兼容面）。目标设备 vivo X200 Pro。
        minSdk 33
        targetSdk 34
        versionCode 19
        versionName '3.15'
    }

    signingConfigs {
        release {
            // keystore 由 CI 从 GitHub Secrets 解码放置到项目根目录
            storeFile rootProject.file('keystore.jks')
            storeType 'PKCS12'
            storePassword System.getenv('KEYSTORE_PASS')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASS')
        }
    }

    buildTypes {
        release {
            // R8 混淆+裁剪：1.65MB → 预期 600KB 左右；WorkManager 自带
            // consumer rules，Manifest 引用的类自动 keep，无需额外 proguard
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

// Force UTF-8 source encoding (Chinese comments break javac under wrong locale)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    // androidx.work 的传递依赖（v3.13 起不再直接用 FileProvider，R8 自动裁剪）
    implementation 'androidx.core:core:1.13.1'
}
